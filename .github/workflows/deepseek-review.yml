name: DeepSeek PR Review

# 应急备用：Claude 订阅额度用完时，用 DeepSeek V4.1 Flash（经 OpenCode Go，按量计费）代替 claude-review。
# 只能手动触发，平时不会自己跑：Actions → DeepSeek PR Review → Run workflow → 填 PR 号。
# 审查结论作为一条 PR 评论发出（手动触发拿不到行内评论工具）。

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 要审查的 PR 号
        required: true
        type: string

permissions: {}

jobs:
  deepseek-pr-review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: Synchain-oss/ci-workflows/.github/workflows/deepseek-review.yml@v1
    with:
      pr_number: ${{ inputs.pr_number }}
      provider: opencode-go
      # 与 claude-review.yml 保持一致
      focus: |
        - 找出 bug、逻辑错误与安全问题
        - 跳过格式、代码风格、类型错误（这些由 CI 负责）以及本 PR 之前就存在的问题
    secrets:
      api_key: ${{ secrets.OPENCODE_GO_API_KEY_FOR_REVIEW }}
