name: PR Agent Code Review

# pr-agent（describe / review / improve），DeepSeek V4.1 Flash 经 OpenCode Go，按量计费。
# 只在 PR → dev 上跑（用户 2026-10-18 裁定），PR 每次 push 都重跑；
# draft / fork / bot 由中央 workflow 跳过。
# 模型、上限、超时、锁定的 pr-agent 镜像都在 Synchain-oss/ci-workflows 的 pr-agent.yml 里统一维护；
# 这里只放本仓专属的 ignore 列表。

on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

jobs:
  pr-agent:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: Synchain-oss/ci-workflows/.github/workflows/pr-agent.yml@v1
    with:
      provider: opencode-go
      ignore_globs: '["package-lock.json", "**/package-lock.json", "docs/superpowers/**", "docs/plans/**"]'
    secrets:
      api_key: ${{ secrets.OPENCODE_GO_API_KEY_FOR_REVIEW }}
