name: CI / unit-tests

on:
  pull_request:
    branches: [dev, staging]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test -- --reporter=verbose 2>&1 | tee test-output.txt

      - name: Build comment body
        id: build-comment
        if: always()
        run: |
          TRUNCATE_LINES=200

          PASSED=$(grep -c "^ ✓" test-output.txt 2>/dev/null || echo 0)
          FAILED=$(grep -c "^ ×" test-output.txt 2>/dev/null || echo 0)
          TOTAL=$((PASSED + FAILED))

          {
            echo "## :test_tube: Unit Test Results"
            echo ""

            if [ "${{ steps.tests.outcome }}" = "success" ]; then
              echo ":white_check_mark: **All tests passed** ($TOTAL/$TOTAL)"
            else
              echo ":x: **Test failures detected**"
              echo ""
              echo "| | Count |"
              echo "|---|---|"
              echo "| :white_check_mark: Passed | $PASSED |"
              echo "| :x: Failed | $FAILED |"
              echo "| **Total** | **$TOTAL** |"
              echo ""

              if [ "$FAILED" -gt 0 ]; then
                echo "### Failed Tests"
                echo '```'
                grep "^ ×" test-output.txt 2>/dev/null | tail -n $TRUNCATE_LINES || echo "(could not parse failures)"
                echo '```'
              fi

              echo "### Full Output"
              echo '```'
              tail -n $TRUNCATE_LINES test-output.txt 2>/dev/null || echo "(no output captured)"
              echo '```'
            fi
            echo ""
          } > /tmp/comment.md

      - name: Post sticky comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: unit-tests
          path: /tmp/comment.md

      - name: Fail if any check failed
        if: |
          always() &&
          steps.tests.outcome == 'failure'
        run: exit 1
