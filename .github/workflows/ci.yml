name: CI

# Full CI matrix: lint + typecheck + prettier (changed files only) / unit tests / web build.
#
# Runs ONLY on PRs whose base is a long-lived branch (`dev`, `staging`, `prod`) — i.e.
# feature code entering the integration chain and promotion PRs. Sub-task PRs whose base
# is a feature branch deliberately do NOT trigger this: run `npm run gates` locally
# instead. See docs/CI.md for the full trigger matrix and the cost rationale.
#
# Replaces the former ci-lint-typecheck.yml + ci-unit-tests.yml (which only listened on
# [dev, staging], so PRs against the default branch `prod` — e.g. Dependabot's — ran no
# CI at all).
#
# FORK SAFETY: the `guard` job runs first and every code-executing job depends on it.
# Without it, `branch-gate.yml` rejecting a fork PR would be an *after-the-fact* refusal —
# both workflows start in parallel, so a fork's `package.json` (preinstall hooks, test/build
# scripts) would already have executed on the runner by the time the gate reported failure.
# `pull_request_target` is deliberately NOT used: it would hand secrets and write permissions
# to untrusted code, which is strictly worse.

on:
  pull_request:
    branches: [dev, staging, prod]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fail-closed: nothing that runs repository code may start before this says the head is an
  # in-repo branch. Jobs skipped via `needs` show up as *skipped*, not green — the honest
  # signal for "we refused to run this".
  guard:
    runs-on: ubuntu-slim
    outputs:
      same_repo: ${{ steps.check.outputs.same_repo }}
    steps:
      - name: Require an in-repo head branch
        id: check
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" = "$THIS_REPO" ]; then
            echo "same_repo=true" >> "$GITHUB_OUTPUT"
            echo "Head branch is in $THIS_REPO — proceeding."
          else
            echo "same_repo=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PR head is the fork '$HEAD_REPO', not $THIS_REPO — refusing to run repository code (no npm ci, no scripts). CI is skipped for fork PRs by design."
          fi

  lint-and-typecheck:
    needs: guard
    if: ${{ needs.guard.outputs.same_repo == 'true' }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # `format:check:changed` diffs against the base branch, so the base history
          # must be present locally.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-output.txt

      - name: Run TypeScript type check
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck-output.txt

      # Prettier is scoped to the files THIS PR touched, and only to violations the change
      # *introduces* (the repo-wide `npm run format:check` is red on ~37 historical files,
      # several of which product branches legitimately edit). Files that were already
      # unformatted on the base are reported as pre-existing debt and do not fail the job.
      - name: Prettier check (no newly-introduced violations)
        id: format
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
          CI_REPORT_PATH: format-changed.json
        run: |
          set -o pipefail
          npm run format:check:changed 2>&1 | tee format-output.txt

      # The prettier policy above is subtle enough to be worth guarding: this asserts the
      # A/B/C/D/E scenarios (new violation fails, pre-existing debt passes, new file fails,
      # clean passes, ignored file skipped) against a throwaway fixture repository.
      - name: CI script policy tests
        id: script-tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:ci-scripts 2>&1 | tee ci-scripts-output.txt

      - name: Build sticky comment section
        if: always()
        run: |
          mkdir -p ci-artifacts
          {
            echo "<!-- section:lint-and-typecheck -->"
            echo "## :mag: Lint, types & formatting"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            if [ "${{ steps.lint.outcome }}" = "success" ]; then
              echo "| ESLint | :white_check_mark: passed |"
            else
              echo "| ESLint | :x: failed |"
            fi
            if [ "${{ steps.typecheck.outcome }}" = "success" ]; then
              echo "| TypeScript | :white_check_mark: passed |"
            else
              echo "| TypeScript | :x: failed |"
            fi
            if [ "${{ steps.format.outcome }}" = "success" ]; then
              echo "| Prettier (new violations only) | :white_check_mark: passed |"
            else
              echo "| Prettier (new violations only) | :x: failed |"
            fi
            if [ "${{ steps.script-tests.outcome }}" = "success" ]; then
              echo "| CI script policy tests | :white_check_mark: passed |"
            else
              echo "| CI script policy tests | :x: failed |"
            fi
            echo ""
            # Pre-existing debt is reported, never fatal — surface it so reviewers can see
            # which historical files this PR happened to touch.
            PREEXISTING=$(jq -r '.preExisting | length' format-changed.json 2>/dev/null || echo '')
            if [ -n "$PREEXISTING" ] && [ "$PREEXISTING" != "0" ]; then
              echo "> ℹ️ ${PREEXISTING} changed file(s) were **already** unformatted on \`${{ github.base_ref }}\` (pre-existing debt, not blocking):"
              echo ">"
              jq -r '.preExisting[] | "> - `" + . + "`"' format-changed.json 2>/dev/null || true
              echo ""
            fi
            echo "Prettier result:"
            echo '```'
            cat format-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'

            if [ "${{ steps.lint.outcome }}" != "success" ] || [ "${{ steps.typecheck.outcome }}" != "success" ]; then
              echo "<details><summary>ESLint output</summary>"
              echo ""
              echo '```'
              tail -n 120 lint-output.txt 2>/dev/null || echo "(no output captured)"
              echo '```'
              echo "</details>"
              echo ""
              echo "<details><summary>TypeScript output</summary>"
              echo ""
              echo '```'
              tail -n 120 typecheck-output.txt 2>/dev/null || echo "(no output captured)"
              echo '```'
              echo "</details>"
            fi
            if [ "${{ steps.script-tests.outcome }}" != "success" ]; then
              echo "<details><summary>CI script policy test output</summary>"
              echo ""
              echo '```'
              cat ci-scripts-output.txt 2>/dev/null || echo "(no output captured)"
              echo '```'
              echo "</details>"
            fi
            echo ""
            echo "> Repo-wide \`npm run format:check\` is not run here — it is red on tracked historical debt. Only *newly introduced* violations fail this check. See \`docs/CI.md\`."
          } > ci-artifacts/lint-and-typecheck.md

      - name: Upload job summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-lint-and-typecheck
          path: ci-artifacts/lint-and-typecheck.md
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if any check failed
        if: |
          always() &&
          (steps.lint.outcome == 'failure' ||
           steps.typecheck.outcome == 'failure' ||
           steps.format.outcome == 'failure' ||
           steps.script-tests.outcome == 'failure')
        run: exit 1

  unit-tests:
    # ubuntu-latest (NOT ubuntu-slim): slim runners are 1 vCPU with a hard,
    # non-overridable 15-minute execution limit. The full vitest suite (shared + server
    # + web/jsdom projects) can exceed that and would be cancelled mid-run.
    needs: guard
    if: ${{ needs.guard.outputs.same_repo == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm test -- --reporter=json --outputFile=vitest-report.json 2>&1 | tee test-output.txt

      - name: Build sticky comment section
        if: always()
        run: |
          mkdir -p ci-artifacts
          TOTAL=$(jq -r '.numTotalTests // 0' vitest-report.json 2>/dev/null || echo '?')
          PASSED=$(jq -r '.numPassedTests // 0' vitest-report.json 2>/dev/null || echo '?')
          FAILED=$(jq -r '.numFailedTests // 0' vitest-report.json 2>/dev/null || echo '?')
          {
            echo "<!-- section:unit-tests -->"
            echo "## :test_tube: Unit tests"
            echo ""
            if [ "${{ steps.tests.outcome }}" = "success" ]; then
              echo ":white_check_mark: **All tests passed** — ${PASSED}/${TOTAL}"
            else
              echo ":x: **Test failures detected**"
              echo ""
              echo "| | Count |"
              echo "|---|---|"
              echo "| :white_check_mark: Passed | ${PASSED} |"
              echo "| :x: Failed | ${FAILED} |"
              echo "| **Total** | **${TOTAL}** |"
              echo ""
              echo "<details><summary>vitest output (tail)</summary>"
              echo ""
              echo '```'
              tail -n 200 test-output.txt 2>/dev/null || echo "(no output captured)"
              echo '```'
              echo "</details>"
            fi
            echo ""
          } > ci-artifacts/unit-tests.md

      - name: Upload job summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-unit-tests
          path: ci-artifacts/unit-tests.md
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if tests failed
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1

  web-build:
    needs: guard
    if: ${{ needs.guard.outputs.same_repo == 'true' }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build:web 2>&1 | tee build-output.txt

      - name: Build sticky comment section
        if: always()
        run: |
          mkdir -p ci-artifacts
          {
            echo "<!-- section:web-build -->"
            echo "## :package: Web build"
            echo ""
            if [ "${{ steps.build.outcome }}" = "success" ]; then
              echo ":white_check_mark: \`vite build\` (packages/web) succeeded."
            else
              echo ":x: \`vite build\` (packages/web) failed:"
              echo ""
              echo '```'
              tail -n 120 build-output.txt 2>/dev/null || echo "(no output captured)"
              echo '```'
            fi
            echo ""
          } > ci-artifacts/web-build.md

      - name: Upload job summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-web-build
          path: ci-artifacts/web-build.md
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if the build failed
        if: always() && steps.build.outcome == 'failure'
        run: exit 1

  # Single sticky comment for the whole matrix. Each job publishes its own Markdown
  # section as a tiny artifact; this job just concatenates them in a fixed order so the
  # comment always has the same shape regardless of which jobs finished first.
  report:
    needs: [guard, lint-and-typecheck, unit-tests, web-build]
    if: ${{ always() && needs.guard.outputs.same_repo == 'true' }}
    runs-on: ubuntu-slim
    steps:
      - name: Download job summaries
        uses: actions/download-artifact@v4
        with:
          pattern: ci-summary-*
          path: ci-artifacts

      - name: Assemble comment
        # Branch names are attacker-controlled on a fork PR, so they reach the script as
        # environment variables rather than being interpolated into the shell (script
        # injection). The branch gate rejects fork PRs, but this job must not depend on it.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "## :vertical_traffic_light: CI — \`${BASE_REF}\` ← \`${HEAD_REF}\`"
            echo ""
            echo "Commit: \`${HEAD_SHA}\`"
            echo ""
            for job in lint-and-typecheck unit-tests web-build; do
              if [ -f "ci-artifacts/ci-summary-${job}/${job}.md" ]; then
                cat "ci-artifacts/ci-summary-${job}/${job}.md"
              else
                echo "## ⚠️ ${job}"
                echo ""
                echo "No summary artifact was produced — the job likely failed before it could report."
                echo ""
              fi
            done
          } > comment.md

      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci
          path: comment.md

      - name: Fail if any upstream job failed
        if: |
          always() &&
          (needs.lint-and-typecheck.result != 'success' ||
           needs.unit-tests.result != 'success' ||
           needs.web-build.result != 'success')
        run: |
          echo "::error::One or more CI jobs failed (lint-and-typecheck=${{ needs.lint-and-typecheck.result }}, unit-tests=${{ needs.unit-tests.result }}, web-build=${{ needs.web-build.result }})."
          exit 1
